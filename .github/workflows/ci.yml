name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DALLOC8_BUILD_TESTS=ON -DALLOC8_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build

      - name: Run tests (native)
        run: ctest --test-dir build --output-on-failure

      - name: Check exported symbols
        run: |
          echo "=== xxfree_sized symbols ==="
          nm -D build/examples/simple_heap/libsimple_heap.so | grep -E 'free_sized|free_aligned_sized'
          echo "=== C23 free_sized/free_aligned_sized ==="
          nm -D build/examples/simple_heap/libsimple_heap.so | grep -E ' T (free_sized|free_aligned_sized)'

      - name: Test interposition (LD_PRELOAD)
        run: LD_PRELOAD=build/examples/simple_heap/libsimple_heap.so ./build/tests/test_basic_alloc

  build-linux-diehard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (DieHard)
        run: cmake -B build -DALLOC8_BUILD_TESTS=ON -DALLOC8_BUILD_EXAMPLES=ON -DALLOC8_BUILD_DIEHARD_EXAMPLE=ON

      - name: Build
        run: cmake --build build

      - name: Run tests (native)
        run: ctest --test-dir build --output-on-failure

      - name: Check DieHard symbols
        run: |
          echo "=== DieHard exported symbols ==="
          nm -D build/examples/diehard/libdiehard_alloc8.so | grep -E 'malloc|free|xxfree_sized'

      - name: Test DieHard interposition (LD_PRELOAD)
        run: LD_PRELOAD=build/examples/diehard/libdiehard_alloc8.so ./build/tests/test_basic_alloc

      - name: Test DieHard threadtest (LD_PRELOAD)
        run: LD_PRELOAD=build/examples/diehard/libdiehard_alloc8.so ./build/tests/threadtest 4 100 1000

  build-linux-hoard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (Hoard)
        run: cmake -B build -DALLOC8_BUILD_TESTS=ON -DALLOC8_BUILD_EXAMPLES=ON -DALLOC8_BUILD_HOARD_EXAMPLE=ON

      - name: Build
        run: cmake --build build

      - name: Run tests (native)
        run: ctest --test-dir build --output-on-failure

      - name: Check Hoard symbols
        run: |
          echo "=== Hoard exported symbols ==="
          nm -D build/examples/hoard/libhoard_alloc8.so | grep -E 'malloc|free|xxfree_sized'

      - name: Test Hoard interposition (LD_PRELOAD)
        run: LD_PRELOAD=build/examples/hoard/libhoard_alloc8.so ./build/tests/test_basic_alloc

      - name: Test Hoard threadtest (LD_PRELOAD)
        run: LD_PRELOAD=build/examples/hoard/libhoard_alloc8.so ./build/tests/threadtest 4 100 1000

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DALLOC8_BUILD_TESTS=ON -DALLOC8_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build

      - name: Run tests (native)
        run: ctest --test-dir build --output-on-failure

      - name: Check exported symbols
        run: nm -gU build/examples/simple_heap/libsimple_heap.dylib | grep -E 'free_sized|free_aligned_sized'

      - name: Test interposition (DYLD_INSERT_LIBRARIES)
        run: DYLD_INSERT_LIBRARIES=build/examples/simple_heap/libsimple_heap.dylib ./build/tests/test_basic_alloc

  build-macos-diehard:
    runs-on: macos-latest
    # DieHard may fail on newer macOS SDKs due to upstream printf_ conflict
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Configure (DieHard)
        run: cmake -B build -DALLOC8_BUILD_TESTS=ON -DALLOC8_BUILD_EXAMPLES=ON -DALLOC8_BUILD_DIEHARD_EXAMPLE=ON

      - name: Build
        run: cmake --build build

      - name: Run tests (native)
        run: ctest --test-dir build --output-on-failure

      - name: Check DieHard symbols
        run: nm -gU build/examples/diehard/libdiehard_alloc8.dylib | grep -E 'free_sized|free_aligned_sized'

      - name: Test DieHard interposition (DYLD_INSERT_LIBRARIES)
        run: DYLD_INSERT_LIBRARIES=build/examples/diehard/libdiehard_alloc8.dylib ./build/tests/test_basic_alloc

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DALLOC8_BUILD_TESTS=ON -DALLOC8_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Run tests (native)
        run: ctest --test-dir build -C Release --output-on-failure

  build-windows-hoard:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (Hoard)
        run: cmake -B build -DALLOC8_BUILD_TESTS=ON -DALLOC8_BUILD_EXAMPLES=ON -DALLOC8_BUILD_HOARD_EXAMPLE=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Run tests (native)
        run: ctest --test-dir build -C Release --output-on-failure
