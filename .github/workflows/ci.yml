name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DALLOC8_BUILD_TESTS=ON -DALLOC8_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build

      - name: Run tests (native)
        run: ctest --test-dir build --output-on-failure

      - name: Check exported symbols
        run: |
          echo "=== xxfree_sized symbols ==="
          nm -D build/examples/simple_heap/libsimple_heap.so | grep -E 'free_sized|free_aligned_sized'
          echo "=== C23 free_sized/free_aligned_sized ==="
          nm -D build/examples/simple_heap/libsimple_heap.so | grep -E ' T (free_sized|free_aligned_sized)'

      - name: Test interposition (LD_PRELOAD)
        run: LD_PRELOAD=build/examples/simple_heap/libsimple_heap.so ./build/tests/test_basic_alloc

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DALLOC8_BUILD_TESTS=ON -DALLOC8_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build

      - name: Run tests (native)
        run: ctest --test-dir build --output-on-failure

      - name: Check exported symbols
        run: nm -gU build/examples/simple_heap/libsimple_heap.dylib | grep -E 'free_sized|free_aligned_sized'

      - name: Test interposition (DYLD_INSERT_LIBRARIES)
        run: DYLD_INSERT_LIBRARIES=build/examples/simple_heap/libsimple_heap.dylib ./build/tests/test_basic_alloc
