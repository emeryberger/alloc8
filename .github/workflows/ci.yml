name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DALLOC8_BUILD_TESTS=ON -DALLOC8_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build

      - name: Run tests (native)
        run: ctest --test-dir build --output-on-failure

      - name: Check exported symbols
        run: |
          echo "=== xxfree_sized symbols ==="
          nm -D build/examples/simple_heap/libsimple_heap.so | grep -E 'free_sized|free_aligned_sized'
          echo "=== C23 free_sized/free_aligned_sized ==="
          nm -D build/examples/simple_heap/libsimple_heap.so | grep -E ' T (free_sized|free_aligned_sized)'

      - name: Test interposition - basic (LD_PRELOAD)
        run: LD_PRELOAD=build/examples/simple_heap/libsimple_heap.so ./build/tests/test_basic_alloc

      - name: Test interposition - malloc API (LD_PRELOAD)
        run: LD_PRELOAD=build/examples/simple_heap/libsimple_heap.so ./build/tests/test_malloc_api

  build-linux-diehard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (DieHard)
        run: cmake -B build -DALLOC8_BUILD_TESTS=ON -DALLOC8_BUILD_EXAMPLES=ON -DALLOC8_BUILD_DIEHARD_EXAMPLE=ON

      - name: Build
        run: cmake --build build

      - name: Run tests (native)
        run: ctest --test-dir build --output-on-failure

      - name: Check DieHard symbols
        run: |
          echo "=== DieHard exported symbols ==="
          nm -D build/examples/diehard/libdiehard_alloc8.so | grep -E 'malloc|free|xxfree_sized'

      - name: Test DieHard interposition - basic (LD_PRELOAD)
        run: LD_PRELOAD=build/examples/diehard/libdiehard_alloc8.so ./build/tests/test_basic_alloc

      - name: Test DieHard interposition - malloc API (LD_PRELOAD)
        run: LD_PRELOAD=build/examples/diehard/libdiehard_alloc8.so ./build/tests/test_malloc_api

      - name: Test DieHard threadtest (LD_PRELOAD)
        run: LD_PRELOAD=build/examples/diehard/libdiehard_alloc8.so ./build/tests/threadtest 4 100 1000

  build-linux-hoard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (Hoard)
        run: cmake -B build -DALLOC8_BUILD_TESTS=ON -DALLOC8_BUILD_EXAMPLES=ON -DALLOC8_BUILD_HOARD_EXAMPLE=ON

      - name: Build
        run: cmake --build build

      - name: Show Hoard version
        run: |
          echo "Hoard commit:"
          git -C build/_deps/hoard-src rev-parse HEAD 2>/dev/null || echo "unknown"
          echo "Heap-Layers commit:"
          git -C build/_deps/heaplayers-src rev-parse HEAD 2>/dev/null || echo "unknown"

      - name: Run tests (native)
        run: ctest --test-dir build --output-on-failure

      - name: Check Hoard symbols
        run: |
          echo "=== Hoard exported symbols ==="
          nm -D build/examples/hoard/libhoard_alloc8.so | grep -E 'malloc|free|xxfree_sized'

      - name: Test Hoard interposition - basic (LD_PRELOAD)
        run: LD_PRELOAD=build/examples/hoard/libhoard_alloc8.so ./build/tests/test_basic_alloc

      - name: Test Hoard interposition - malloc API (LD_PRELOAD)
        run: LD_PRELOAD=build/examples/hoard/libhoard_alloc8.so ./build/tests/test_malloc_api

      - name: Test Hoard threadtest (LD_PRELOAD)
        run: LD_PRELOAD=build/examples/hoard/libhoard_alloc8.so ./build/tests/threadtest 4 100 1000

  # arm64: same as build-linux-hoard but on the aarch64 glibc ABI
  # (baseline GLIBC_2.17). Guards the aligned_alloc symbol-versioning
  # fix: with aligned_alloc exported below the baseline, ld.so silently
  # bypasses LD_PRELOAD for it and test_malloc_api crashes.
  build-linux-arm64-hoard:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Configure (Hoard)
        run: cmake -B build -DALLOC8_BUILD_TESTS=ON -DALLOC8_BUILD_EXAMPLES=ON -DALLOC8_BUILD_HOARD_EXAMPLE=ON

      - name: Build
        run: cmake --build build

      - name: Check aligned_alloc symbol version
        run: |
          echo "=== aligned_alloc export (must be at or above the aarch64 baseline GLIBC_2.17) ==="
          objdump -T build/examples/hoard/libhoard_alloc8.so | grep aligned_alloc
          objdump -T build/examples/hoard/libhoard_alloc8.so | grep aligned_alloc | grep -q "GLIBC_2.17" || exit 1

      - name: Test Hoard interposition - basic (LD_PRELOAD)
        run: LD_PRELOAD=build/examples/hoard/libhoard_alloc8.so ./build/tests/test_basic_alloc

      - name: Test Hoard interposition - malloc API (LD_PRELOAD)
        run: LD_PRELOAD=build/examples/hoard/libhoard_alloc8.so ./build/tests/test_malloc_api

      - name: Test Hoard threadtest (LD_PRELOAD)
        run: LD_PRELOAD=build/examples/hoard/libhoard_alloc8.so ./build/tests/threadtest 4 100 1000

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DALLOC8_BUILD_TESTS=ON -DALLOC8_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build

      - name: Run tests (native)
        run: ctest --test-dir build --output-on-failure

      - name: Check exported symbols
        run: nm -gU build/examples/simple_heap/libsimple_heap.dylib | grep -E 'free_sized|free_aligned_sized'

      - name: Test interposition - basic (DYLD_INSERT_LIBRARIES)
        run: DYLD_INSERT_LIBRARIES=build/examples/simple_heap/libsimple_heap.dylib ./build/tests/test_basic_alloc

      - name: Test interposition - malloc API (DYLD_INSERT_LIBRARIES)
        run: DYLD_INSERT_LIBRARIES=build/examples/simple_heap/libsimple_heap.dylib ./build/tests/test_malloc_api

  build-macos-diehard:
    runs-on: macos-latest
    # DieHard may fail on newer macOS SDKs due to upstream printf_ conflict
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Configure (DieHard)
        run: cmake -B build -DALLOC8_BUILD_TESTS=ON -DALLOC8_BUILD_EXAMPLES=ON -DALLOC8_BUILD_DIEHARD_EXAMPLE=ON

      - name: Build
        run: cmake --build build

      - name: Run tests (native)
        run: ctest --test-dir build --output-on-failure

      - name: Check DieHard symbols
        run: |
          echo "=== DieHard exported symbols ==="
          nm -gU build/examples/diehard/libdiehard_alloc8.dylib | grep -E 'malloc|free' || echo "(symbols may be LTO-internalized)"

      - name: Test DieHard interposition - basic (DYLD_INSERT_LIBRARIES)
        run: DYLD_INSERT_LIBRARIES=build/examples/diehard/libdiehard_alloc8.dylib ./build/tests/test_basic_alloc

      - name: Test DieHard interposition - malloc API (DYLD_INSERT_LIBRARIES)
        run: DYLD_INSERT_LIBRARIES=build/examples/diehard/libdiehard_alloc8.dylib ./build/tests/test_malloc_api

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DALLOC8_BUILD_TESTS=ON -DALLOC8_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Run tests (native)
        run: ctest --test-dir build -C Release --output-on-failure

  build-windows-diehard:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (DieHard)
        run: cmake -B build -DALLOC8_BUILD_TESTS=ON -DALLOC8_BUILD_EXAMPLES=ON -DALLOC8_BUILD_DIEHARD_EXAMPLE=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Run tests (native)
        run: ctest --test-dir build -C Release --output-on-failure

  build-windows-hoard:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (Hoard)
        run: cmake -B build -DALLOC8_BUILD_TESTS=ON -DALLOC8_BUILD_EXAMPLES=ON -DALLOC8_BUILD_HOARD_EXAMPLE=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Run tests (native)
        run: ctest --test-dir build -C Release --output-on-failure
